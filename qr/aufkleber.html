<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-Kärtchen – Akpinar Speisekarte</title>
<style>
  @page { size: A4 portrait; margin: 8mm; }

    /* Schriften lokal, damit der Druck unabhängig vom Internet identisch aussieht */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-400-italic.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: italic;
    font-weight: 600;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-600-italic.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("../assets/fonts/inter-latin-800-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Playfair Display";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("../assets/fonts/playfair-display-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Playfair Display";
    font-style: italic;
    font-weight: 700;
    font-display: swap;
    src: url("../assets/fonts/playfair-display-latin-700-italic.woff2") format("woff2");
  }
  @font-face {
    font-family: "Playfair Display";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("../assets/fonts/playfair-display-latin-800-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Playfair Display";
    font-style: italic;
    font-weight: 800;
    font-display: swap;
    src: url("../assets/fonts/playfair-display-latin-800-italic.woff2") format("woff2");
  }


  :root {
    --bg:   #0c0a09;
    --gold: #e2b35f;
    --gold-3: #b98a3c;
    --red:  #c1201f;
    --serif: "Playfair Display", "Iowan Old Style", Palatino, Georgia, serif;
    --sans:  "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #6b6b6b;
    font-family: var(--sans);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 12mm auto;
    padding: 8mm;
    background: #fff;
    box-shadow: 0 6px 34px rgba(0, 0, 0, .4);
  }

  /* Feste Spaltenbreiten statt 1fr: eine Teilung von 194 mm durch 2 rundet je
     nach Ausgabeauflösung ungleich, und jedes prozentual bemessene Kind erbt
     diesen Fehler — die Karten sähen dann spaltenweise verschieden aus. */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 95mm);
    justify-content: space-between;
    gap: 4mm 0;
  }

  .card {
    width: 95mm;
    height: 62mm;
    padding: 5mm;
    border: .3mm dashed #bbb;
    border-radius: 2mm;
    /* Bewusst eine Volltonfläche statt eines Verlaufs: auf 95 x 62 mm bringt
       ein Verlauf gestalterisch nichts, bandet aber auf einfachen Druckern,
       fällt je nach Gerät anders aus und verbraucht mehr Toner. Volltonfarbe
       sieht auf jedem Drucker und auf jedem Kärtchen gleich aus. */
    background: #16110f;
    box-shadow: inset 0 0 0 .4mm rgba(226, 179, 95, .30);
    color: #f4efe9;
    display: flex;
    align-items: center;
    gap: 5mm;
    isolation: isolate;
  }

  .card__qr {
    flex: none;
    padding: 2.4mm;
    background: #fff;
    border-radius: 1.6mm;
  }
  .card__qr img { display: block; width: 30mm; height: 30mm; }

  .card__text { width: 50mm; flex: none; }

  /* Das Logo ist fuer schwarzen Grund gezeichnet; `screen` macht sein
     Schwarz auf dem dunklen Kaertchen unsichtbar. */
  .brand {
    display: block;
    width: 46mm;
    height: auto;
    mix-blend-mode: screen;
  }

  .lead {
    margin: 3mm 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 800;
    font-size: 10.5pt;
    color: #f6dea4;
    line-height: 1.25;
  }
  .lead small {
    display: block;
    margin-top: .8mm;
    font-family: var(--sans);
    font-style: normal;
    font-weight: 600;
    font-size: 6.6pt;
    letter-spacing: .03em;
    color: #c3b7ab;
  }

  .phone {
    margin-top: 3mm;
    padding-top: 2.4mm;
    border-top: .3mm solid rgba(226, 179, 95, .32);
    font-family: var(--serif);
    font-weight: 800;
    font-size: 12pt;
    color: var(--gold);
  }
  .addr { margin-top: .6mm; font-size: 6.6pt; color: #c3b7ab; }

  .hint {
    max-width: 180mm;
    margin: 0 auto 10mm;
    padding: 6mm 8mm;
    background: #fff;
    border-radius: 3mm;
    color: #222;
    font-size: 10pt;
    line-height: 1.6;
  }
  .hint h1 { margin: 0 0 3mm; font-size: 13pt; }

  @media print {
    body { background: #fff; }
    .sheet { margin: 0; padding: 0; box-shadow: none; min-height: 0; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="hint">
  <h1>QR-Kärtchen drucken</h1>
  8 Kärtchen auf einer A4-Seite — für Theke, Lieferbeutel, Flyer oder als Aufkleber.
  Auf <b>A4</b> drucken (Skalierung 100 %, Hintergrundgrafiken aktivieren) und an den
  gestrichelten Linien ausschneiden. Auf Etikettenpapier werden daraus Aufkleber.
</div>

<div class="sheet">
  <div class="grid" id="grid"></div>
</div>

<script>
  var card =
    '<div class="card">' +
      '<div class="card__qr"><img src="speisekarte-qr.png" alt="QR-Code zur Online-Speisekarte"></div>' +
      '<div class="card__text">' +
        '<img class="brand" src="../assets/img/logo-print.png" alt="Akpinar – Döner &amp; Pizza">' +
        '<p class="lead">Speisekarte online<small>Mit der Handy-Kamera scannen</small></p>' +
        '<div class="phone">08671-9580145</div>' +
        '<div class="addr">Neuöttinger Str. 20 · 84503 Altötting</div>' +
      '</div>' +
    '</div>';
  document.getElementById('grid').innerHTML = new Array(8).fill(card).join('');
</script>
</body>
</html>
