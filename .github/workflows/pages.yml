name: Deploy zur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Setzt voraus, dass Pages einmalig unter Settings → Pages mit
      # Source: "GitHub Actions" aktiviert wurde. Das kann der Workflow nicht
      # selbst erledigen: der GITHUB_TOKEN darf mit pages: write zwar auf eine
      # bestehende Pages-Site deployen, aber keine neue anlegen
      # ("Create Pages site failed: Resource not accessible by integration").
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
